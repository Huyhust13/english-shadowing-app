<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadowing Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F1F0EC;
    --surface: #FFFFFF;
    --surface-2: #E7E5DE;
    --text: #17211C;
    --muted: #5E6B63;
    --line: #D7D4CA;
    --accent: #B4722E;
    --accent-ink: #FFFFFF;
    --success: #2F7A66;
    --wave-track: #DEDBD1;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11181A;
      --surface: #19221F;
      --surface-2: #212B27;
      --text: #ECEAE2;
      --muted: #8FA099;
      --line: #2B3733;
      --accent: #E0A458;
      --accent-ink: #1A140A;
      --success: #5FB8A0;
      --wave-track: #263330;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11181A;
    --surface: #19221F;
    --surface-2: #212B27;
    --text: #ECEAE2;
    --muted: #8FA099;
    --line: #2B3733;
    --accent: #E0A458;
    --accent-ink: #1A140A;
    --success: #5FB8A0;
    --wave-track: #263330;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Sora', system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 28px 20px 64px;
  }
  header.top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 22px;
  }
  .title-block h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .title-block p {
    margin: 0;
    color: var(--muted);
    font-size: 0.92rem;
    max-width: 38ch;
  }
  .theme-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 8px;
    padding: 7px 11px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
    flex-shrink: 0;
  }
  .theme-btn:hover { color: var(--text); border-color: var(--accent); }

  .streak-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 22px;
    margin-bottom: 18px;
  }
  .streak-counter {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-weight: 700;
    font-size: 2.6rem;
    color: var(--accent);
    line-height: 1;
    min-width: 2.4ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .streak-copy .label {
    font-size: 0.78rem;
    color: var(--muted);
    text-transform: none;
  }
  .streak-copy .sub {
    font-size: 0.82rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .wave-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px 14px;
    margin-bottom: 18px;
  }
  .wave-card h2 {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 14px;
  }
  .wave-row {
    display: flex;
    align-items: flex-end;
    gap: 5px;
    height: 68px;
  }
  .wave-bar {
    flex: 1;
    background: var(--wave-track);
    border-radius: 3px;
    min-height: 4px;
    position: relative;
    cursor: default;
  }
  .wave-bar[data-active="1"] { background: var(--success); }
  .wave-bar[data-today="1"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .wave-labels {
    display: flex;
    gap: 5px;
    margin-top: 6px;
  }
  .wave-labels span {
    flex: 1;
    text-align: center;
    font-size: 0.62rem;
    color: var(--muted);
  }

  .clip-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .clip-card h2 {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 0.78rem;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .field input[type="text"],
  .field input[type="url"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 11px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
  }
  .field textarea { resize: vertical; min-height: 54px; }
  .field input:focus, .field textarea:focus, .theme-btn:focus, button:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .row-2 { display: flex; gap: 12px; }
  .row-2 > div { flex: 1; }

  .confidence-row {
    display: flex;
    gap: 6px;
  }
  .conf-btn {
    flex: 1;
    padding: 9px 0;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .conf-btn[aria-pressed="true"] {
    background: var(--success);
    border-color: var(--success);
    color: #fff;
  }

  .log-btn {
    width: 100%;
    margin-top: 6px;
    padding: 11px 0;
    border-radius: 9px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.92rem;
    cursor: pointer;
  }
  .log-btn:hover { filter: brightness(1.05); }
  .log-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .history h2 {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--muted);
    margin: 0 0 12px;
  }
  .entry {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
  }
  .entry:last-child { border-bottom: none; }
  .entry .date {
    font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    font-size: 0.72rem;
    color: var(--muted);
    width: 62px;
    flex-shrink: 0;
    padding-top: 2px;
  }
  .entry .body { flex: 1; min-width: 0; }
  .entry .clip-title {
    font-size: 0.88rem;
    font-weight: 600;
  }
  .entry .meta {
    font-size: 0.76rem;
    color: var(--muted);
    margin-top: 2px;
  }
  .entry .notes {
    font-size: 0.82rem;
    color: var(--text);
    margin-top: 5px;
    opacity: 0.85;
  }
  .empty {
    color: var(--muted);
    font-size: 0.85rem;
    padding: 18px 0;
    text-align: center;
  }
  a { color: var(--accent); }

  .clip-card[data-editing="1"] { border-color: var(--accent); }
  .clip-card .card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .field input[type="date"] {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 11px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.92rem;
    color-scheme: light dark;
  }
  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions .log-btn { margin-top: 0; }
  .cancel-btn {
    padding: 11px 18px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    font-family: inherit;
    font-size: 0.92rem;
    cursor: pointer;
    flex-shrink: 0;
  }
  .cancel-btn:hover { color: var(--text); }
  [hidden] { display: none !important; }

  /* Rich-text notes editor */
  .editor {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--bg);
    overflow: hidden;
  }
  .editor:focus-within { border-color: var(--accent); }
  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 2px;
    padding: 5px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .toolbar .sep { width: 1px; background: var(--line); margin: 3px 4px; }
  .tool-btn {
    min-width: 32px;
    height: 30px;
    padding: 0 8px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .tool-btn:hover { background: var(--surface); border-color: var(--line); }
  .tool-btn[aria-pressed="true"] { background: var(--surface); border-color: var(--accent); color: var(--accent); }
  .notes-input {
    min-height: 220px;
    max-height: 70vh;
    overflow-y: auto;
    resize: vertical;
    padding: 12px 14px;
    color: var(--text);
    font-size: 0.95rem;
    line-height: 1.65;
    outline: none;
  }
  .notes-input.is-empty::before {
    content: attr(data-placeholder);
    color: var(--muted);
    pointer-events: none;
  }
  .rich p, .rich div { margin: 0; }
  .rich ul, .rich ol { margin: 4px 0; padding-left: 1.5em; }
  .rich mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; padding: 0 1px; border-radius: 2px; }

  /* History entries: actions + collapsible notes */
  .entry .head-row { display: flex; align-items: flex-start; gap: 10px; }
  .entry .head-row .clip-title { flex: 1; min-width: 0; }
  .entry-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .entry-actions button {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--muted);
    border-radius: 6px;
    padding: 3px 9px;
    font-family: inherit;
    font-size: 0.72rem;
    cursor: pointer;
  }
  .entry-actions button:hover { color: var(--text); border-color: var(--accent); }
  .entry-actions button.danger[data-armed="1"] { background: #B3412E; border-color: #B3412E; color: #fff; }
  .entry .notes { line-height: 1.6; }
  .entry .notes.clamped { max-height: 9.6em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
  .more-btn {
    border: none;
    background: none;
    padding: 2px 0;
    margin-top: 2px;
    color: var(--accent);
    font-family: inherit;
    font-size: 0.76rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="title-block">
      <h1>Shadowing Tracker</h1>
      <p>Log each session, watch the streak build, keep the habit going.</p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button">Dark</button>
  </header>

  <section class="streak-card">
    <div class="streak-counter" id="streakCount">0</div>
    <div class="streak-copy">
      <div class="label">day streak</div>
      <div class="sub" id="streakSub">Log today's session to start one.</div>
    </div>
  </section>

  <section class="wave-card">
    <h2>Last 14 days</h2>
    <div class="wave-row" id="waveRow"></div>
    <div class="wave-labels" id="waveLabels"></div>
  </section>

  <section class="clip-card" id="clipCard">
    <div class="card-head">
      <h2 id="formHeading">Today's session</h2>
    </div>
    <div class="field" id="dateField" hidden>
      <label for="sessionDate">Date</label>
      <input type="date" id="sessionDate">
    </div>
    <div class="field">
      <label for="clipTitle">Clip title</label>
      <input type="text" id="clipTitle" placeholder="e.g. My Year Living With a Robot — TED">
    </div>
    <div class="field">
      <label for="clipUrl">Link (optional)</label>
      <input type="url" id="clipUrl" placeholder="https://www.ted.com/talks/...">
    </div>
    <div class="row-2">
      <div class="field">
        <label for="reps">Repetitions</label>
        <input type="number" id="reps" min="1" max="30" value="5">
      </div>
      <div class="field">
        <label>How did it feel?</label>
        <div class="confidence-row" id="confRow">
          <button type="button" class="conf-btn" data-val="1">Rough</button>
          <button type="button" class="conf-btn" data-val="2">OK</button>
          <button type="button" class="conf-btn" data-val="3">Smooth</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label id="notesLabel">Notes &amp; script (tricky words, rhythm, anything to fix)</label>
      <div class="editor">
        <div class="toolbar" role="toolbar" aria-label="Formatting">
          <button type="button" class="tool-btn" data-cmd="bold" title="Bold (Ctrl+B)" aria-pressed="false"><b>B</b></button>
          <button type="button" class="tool-btn" data-cmd="italic" title="Italic (Ctrl+I)" aria-pressed="false"><i>I</i></button>
          <button type="button" class="tool-btn" data-cmd="underline" title="Underline (Ctrl+U)" aria-pressed="false"><u>U</u></button>
          <button type="button" class="tool-btn" data-cmd="strikeThrough" title="Strikethrough" aria-pressed="false"><s>S</s></button>
          <button type="button" class="tool-btn" data-cmd="highlight" title="Highlight (Ctrl+Shift+H)" aria-pressed="false"><mark style="background:color-mix(in srgb, var(--accent) 35%, transparent);color:inherit;padding:0 3px">H</mark></button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" class="tool-btn" data-cmd="insertUnorderedList" title="Bullet list" aria-pressed="false">• List</button>
          <button type="button" class="tool-btn" data-cmd="insertOrderedList" title="Numbered list" aria-pressed="false">1. List</button>
          <span class="sep" aria-hidden="true"></span>
          <button type="button" class="tool-btn" data-cmd="removeFormat" title="Clear formatting">Clear</button>
        </div>
        <div class="notes-input rich is-empty" id="notes" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="notesLabel"
             data-placeholder="Paste the script here, or note tricky words, e.g. struggled with 'autonomous', linking in 'check it out'"></div>
      </div>
    </div>
    <div class="form-actions">
      <button class="log-btn" id="logBtn" type="button">Log today's session</button>
      <button class="cancel-btn" id="cancelEditBtn" type="button" hidden>Cancel</button>
    </div>
  </section>

  <section class="history">
    <h2>History</h2>
    <div id="historyList"></div>
  </section>

</div>

<script>
(function () {
  "use strict";

  // Legacy localStorage key; only read once to import old sessions into SQLite.
  var STORAGE_KEY = "shadowing-tracker-sessions";
  var API = "/api/sessions";
  var LOG_LABEL = "Log today's session";
  var confSelected = null;
  var sessionsCache = [];
  var editing = null; // the session currently loaded into the form for editing

  function todayISO() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function load() {
    return sessionsCache;
  }

  function fetchSessions() {
    return fetch(API).then(function (res) {
      if (!res.ok) throw new Error("GET " + API + " failed: " + res.status);
      return res.json();
    }).then(function (rows) {
      sessionsCache = rows;
      return rows;
    });
  }

  function sendJSON(method, url, payload) {
    return fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: payload === undefined ? undefined : JSON.stringify(payload)
    }).then(function (res) {
      if (!res.ok) throw new Error(method + " " + url + " failed: " + res.status);
    });
  }

  function postJSON(url, payload) {
    return sendJSON("POST", url, payload);
  }

  // Notes are stored as HTML. Only these tags survive; every attribute is dropped.
  var ALLOWED_TAGS = { B: 1, STRONG: 1, I: 1, EM: 1, U: 1, S: 1, STRIKE: 1, MARK: 1, UL: 1, OL: 1, LI: 1, BR: 1, P: 1, DIV: 1 };
  var DROPPED_TAGS = { SCRIPT: 1, STYLE: 1, TEMPLATE: 1, IFRAME: 1, OBJECT: 1, EMBED: 1, NOSCRIPT: 1 };

  function sanitizeHTML(html) {
    var doc = new DOMParser().parseFromString("<body>" + html + "</body>", "text/html");
    var out = document.createElement("div");
    (function copy(src, dest) {
      src.childNodes.forEach(function (node) {
        if (node.nodeType === Node.TEXT_NODE) {
          dest.appendChild(document.createTextNode(node.nodeValue));
        } else if (node.nodeType === Node.ELEMENT_NODE && !DROPPED_TAGS[node.tagName]) {
          if (ALLOWED_TAGS[node.tagName]) {
            var el = document.createElement(node.tagName);
            dest.appendChild(el);
            copy(node, el);
          } else {
            copy(node, dest); // keep the text of unknown tags, drop the tag itself
          }
        }
      });
    })(doc.body, out);
    return out.innerHTML;
  }

  // Older notes are plain text; newer ones are HTML from the editor.
  function notesToHTML(notes) {
    if (/<\/?[a-z][^>]*>/i.test(notes)) return sanitizeHTML(notes);
    var d = document.createElement("div");
    d.textContent = notes;
    return d.innerHTML.replace(/\n/g, "<br>");
  }

  // One-time move of sessions saved by the old localStorage version into SQLite.
  function importLegacySessions() {
    var legacy = null;
    try { legacy = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) {}
    if (!Array.isArray(legacy) || legacy.length === 0) return Promise.resolve();
    return postJSON(API + "/import", legacy).then(function () {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    }).catch(function (e) { console.error(e); });
  }

  function dateLabel(iso) {
    var d = new Date(iso + "T00:00:00");
    return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function daysAgoISO(n) {
    var d = new Date();
    d.setDate(d.getDate() - n);
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function computeStreak(sessions) {
    var daysWithSession = {};
    sessions.forEach(function (s) { daysWithSession[s.date] = true; });
    var streak = 0;
    var cursor = todayISO();
    if (!daysWithSession[cursor]) {
      cursor = daysAgoISO(1);
      if (!daysWithSession[cursor]) return 0;
    }
    var i = 0;
    while (daysWithSession[daysAgoISO(i)]) {
      streak++;
      i++;
    }
    return streak;
  }

  function renderStreak(sessions) {
    var streak = computeStreak(sessions);
    document.getElementById("streakCount").textContent = String(streak);
    var sub = document.getElementById("streakSub");
    if (streak === 0) {
      sub.textContent = "Log today's session to start one.";
    } else if (daysWithToday(sessions)) {
      sub.textContent = "Logged today — keep it going tomorrow.";
    } else {
      sub.textContent = "Log today to keep the streak alive.";
    }
  }

  function daysWithToday(sessions) {
    var t = todayISO();
    return sessions.some(function (s) { return s.date === t; });
  }

  function renderWave(sessions) {
    var repsByDay = {};
    sessions.forEach(function (s) {
      repsByDay[s.date] = (repsByDay[s.date] || 0) + (Number(s.reps) || 0);
    });
    var maxReps = 1;
    for (var k = 0; k < 14; k++) {
      var iso = daysAgoISO(k);
      if (repsByDay[iso] > maxReps) maxReps = repsByDay[iso];
    }
    var row = document.getElementById("waveRow");
    var labels = document.getElementById("waveLabels");
    row.innerHTML = "";
    labels.innerHTML = "";
    for (var i = 13; i >= 0; i--) {
      var iso2 = daysAgoISO(i);
      var reps = repsByDay[iso2] || 0;
      var bar = document.createElement("div");
      bar.className = "wave-bar";
      var pct = reps > 0 ? Math.max(10, Math.round((reps / maxReps) * 100)) : 4;
      bar.style.height = pct + "%";
      if (reps > 0) bar.setAttribute("data-active", "1");
      if (i === 0) bar.setAttribute("data-today", "1");
      bar.title = dateLabel(iso2) + (reps ? (": " + reps + " reps") : ": no session");
      row.appendChild(bar);

      var lbl = document.createElement("span");
      lbl.textContent = i === 0 ? "Today" : (i % 3 === 0 ? dateLabel(iso2) : "");
      labels.appendChild(lbl);
    }
  }

  function confWord(val) {
    return val === 3 ? "Smooth" : val === 2 ? "OK" : val === 1 ? "Rough" : "";
  }

  function renderHistory(sessions) {
    var list = document.getElementById("historyList");
    list.innerHTML = "";
    if (sessions.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No sessions logged yet.";
      list.appendChild(empty);
      return;
    }
    var sorted = sessions.slice().sort(function (a, b) {
      return (b.date + b.loggedAt) > (a.date + a.loggedAt) ? 1 : -1;
    });
    sorted.forEach(function (s) {
      var entry = document.createElement("div");
      entry.className = "entry";

      var date = document.createElement("div");
      date.className = "date";
      date.textContent = dateLabel(s.date);

      var body = document.createElement("div");
      body.className = "body";

      var titleEl = document.createElement("div");
      titleEl.className = "clip-title";
      if (s.clipUrl) {
        var a = document.createElement("a");
        a.href = s.clipUrl;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = s.clipTitle || "Untitled clip";
        titleEl.appendChild(a);
      } else {
        titleEl.textContent = s.clipTitle || "Untitled clip";
      }

      var meta = document.createElement("div");
      meta.className = "meta";
      var metaParts = [];
      metaParts.push(s.reps + " rep" + (s.reps === 1 ? "" : "s"));
      if (s.confidence) metaParts.push(confWord(s.confidence));
      meta.textContent = metaParts.join(" · ");

      body.appendChild(titleEl);
      body.appendChild(meta);

      var headRow = document.createElement("div");
      headRow.className = "head-row";
      headRow.appendChild(titleEl);
      headRow.appendChild(entryActions(s));
      body.insertBefore(headRow, meta);

      var notes = null;
      if (s.notes) {
        notes = document.createElement("div");
        notes.className = "notes rich clamped";
        notes.innerHTML = notesToHTML(s.notes);
        body.appendChild(notes);
      }

      entry.appendChild(date);
      entry.appendChild(body);
      list.appendChild(entry);

      // Long scripts start collapsed; only offer "Show more" when there is more to show.
      if (notes) {
        if (notes.scrollHeight <= notes.clientHeight + 2) {
          notes.classList.remove("clamped");
        } else {
          var more = document.createElement("button");
          more.type = "button";
          more.className = "more-btn";
          more.textContent = "Show more";
          more.addEventListener("click", function () {
            var collapsed = notes.classList.toggle("clamped");
            more.textContent = collapsed ? "Show more" : "Show less";
          });
          body.appendChild(more);
        }
      }
    });
  }

  function entryActions(s) {
    var wrap = document.createElement("div");
    wrap.className = "entry-actions";

    var edit = document.createElement("button");
    edit.type = "button";
    edit.textContent = "Edit";
    edit.addEventListener("click", function () { startEdit(s); });

    // Two-step delete: first click arms the button, second click within 3s deletes.
    var del = document.createElement("button");
    del.type = "button";
    del.className = "danger";
    del.textContent = "Delete";
    var disarmTimer = null;
    del.addEventListener("click", function () {
      if (del.getAttribute("data-armed") !== "1") {
        del.setAttribute("data-armed", "1");
        del.textContent = "Delete?";
        disarmTimer = setTimeout(function () {
          del.removeAttribute("data-armed");
          del.textContent = "Delete";
        }, 3000);
        return;
      }
      clearTimeout(disarmTimer);
      del.disabled = true;
      sendJSON("DELETE", API + "/" + s.id).then(function () {
        if (editing && editing.id === s.id) resetForm();
        return fetchSessions();
      }).then(renderAll).catch(function (e) {
        console.error(e);
        del.disabled = false;
        del.textContent = "Failed — retry";
      });
    });

    wrap.appendChild(edit);
    wrap.appendChild(del);
    return wrap;
  }

  function renderAll() {
    var sessions = load();
    renderStreak(sessions);
    renderWave(sessions);
    renderHistory(sessions);
  }

  function setConfidence(val) {
    confSelected = val || null;
    document.querySelectorAll(".conf-btn").forEach(function (b) {
      b.setAttribute("aria-pressed", Number(b.getAttribute("data-val")) === confSelected ? "true" : "false");
    });
  }

  function setupConfidence() {
    document.querySelectorAll(".conf-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var val = Number(btn.getAttribute("data-val"));
        setConfidence(confSelected === val ? null : val);
      });
    });
  }

  // ---- Notes editor -------------------------------------------------------

  function notesEl() {
    return document.getElementById("notes");
  }

  function getNotes() {
    var ed = notesEl();
    if (!ed.textContent.trim()) return "";
    return sanitizeHTML(ed.innerHTML);
  }

  function setNotes(notes) {
    notesEl().innerHTML = notes ? notesToHTML(notes) : "";
    updateNotesEmpty();
  }

  function updateNotesEmpty() {
    var ed = notesEl();
    ed.classList.toggle("is-empty", !ed.textContent.trim() && !ed.querySelector("li"));
  }

  function closestIn(node, tagName, root) {
    while (node && node !== root) {
      if (node.nodeName === tagName) return node;
      node = node.parentNode;
    }
    return null;
  }

  function unwrap(el) {
    var parent = el.parentNode;
    while (el.firstChild) parent.insertBefore(el.firstChild, el);
    parent.removeChild(el);
  }

  function selectionRangeIn(root) {
    var sel = window.getSelection();
    if (!sel.rangeCount) return null;
    var range = sel.getRangeAt(0);
    return root.contains(range.commonAncestorContainer) ? range : null;
  }

  // execCommand has no native <mark> support, so highlight is done by hand.
  function toggleHighlight(ed) {
    var range = selectionRangeIn(ed);
    if (!range) return;
    var mark = closestIn(range.commonAncestorContainer, "MARK", ed);
    if (mark) {
      unwrap(mark);
      return;
    }
    if (range.collapsed) return;
    var holder = document.createElement("div");
    holder.appendChild(range.cloneContents());
    holder.querySelectorAll("mark").forEach(unwrap);
    document.execCommand("insertHTML", false, "<mark>" + holder.innerHTML + "</mark>");
  }

  function clearFormatting(ed) {
    var range = selectionRangeIn(ed);
    document.execCommand("removeFormat");
    if (range) {
      ed.querySelectorAll("mark").forEach(function (m) {
        if (range.intersectsNode(m)) unwrap(m);
      });
    }
  }

  function setupEditor() {
    var ed = notesEl();
    var buttons = document.querySelectorAll(".tool-btn");
    try { document.execCommand("styleWithCSS", false, false); } catch (e) {}

    function run(cmd) {
      ed.focus();
      if (cmd === "highlight") toggleHighlight(ed);
      else if (cmd === "removeFormat") clearFormatting(ed);
      else document.execCommand(cmd);
      updateNotesEmpty();
      updateToolbar();
    }

    function updateToolbar() {
      var sel = window.getSelection();
      var inside = sel.rangeCount > 0 && ed.contains(sel.anchorNode);
      buttons.forEach(function (btn) {
        var cmd = btn.getAttribute("data-cmd");
        if (cmd === "removeFormat") return;
        var on = false;
        if (inside) {
          on = cmd === "highlight" ? !!closestIn(sel.anchorNode, "MARK", ed) : document.queryCommandState(cmd);
        }
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
    }

    buttons.forEach(function (btn) {
      btn.addEventListener("mousedown", function (e) { e.preventDefault(); }); // keep the text selection
      btn.addEventListener("click", function () { run(btn.getAttribute("data-cmd")); });
    });

    ed.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && e.key.toLowerCase() === "h") {
        e.preventDefault();
        run("highlight");
      }
    });

    // Paste as plain text so scripts copied from web pages don't bring their styling along.
    ed.addEventListener("paste", function (e) {
      e.preventDefault();
      var text = (e.clipboardData || window.clipboardData).getData("text/plain");
      document.execCommand("insertText", false, text);
    });

    ed.addEventListener("input", updateNotesEmpty);
    document.addEventListener("selectionchange", updateToolbar);
  }

  // ---- Edit mode ----------------------------------------------------------

  function startEdit(s) {
    editing = s;
    document.getElementById("clipTitle").value = s.clipTitle || "";
    document.getElementById("clipUrl").value = s.clipUrl || "";
    document.getElementById("reps").value = s.reps || 1;
    document.getElementById("sessionDate").value = s.date;
    setConfidence(s.confidence);
    setNotes(s.notes);

    document.getElementById("dateField").hidden = false;
    document.getElementById("cancelEditBtn").hidden = false;
    document.getElementById("formHeading").textContent = "Editing session · " + dateLabel(s.date);
    document.getElementById("logBtn").textContent = "Save changes";
    var card = document.getElementById("clipCard");
    card.setAttribute("data-editing", "1");
    card.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function resetForm() {
    var wasEditing = !!editing;
    editing = null;
    if (wasEditing) {
      document.getElementById("clipTitle").value = "";
      document.getElementById("clipUrl").value = "";
      document.getElementById("reps").value = 5;
    }
    setConfidence(null);
    setNotes("");
    document.getElementById("dateField").hidden = true;
    document.getElementById("cancelEditBtn").hidden = true;
    document.getElementById("formHeading").textContent = "Today's session";
    document.getElementById("logBtn").textContent = LOG_LABEL;
    document.getElementById("clipCard").removeAttribute("data-editing");
  }

  // Fill the clip title from the link, without overwriting a title the person typed.
  function setupAutoTitle() {
    var urlInput = document.getElementById("clipUrl");
    var titleInput = document.getElementById("clipTitle");
    var defaultPlaceholder = titleInput.placeholder;
    var autoTitle = "";
    var timer = null;
    var requestId = 0;

    function lookup() {
      var url = urlInput.value.trim();
      if (!/^https?:\/\/\S+\.\S+/.test(url)) return;
      if (titleInput.value.trim() && titleInput.value !== autoTitle) return;

      var id = ++requestId;
      titleInput.placeholder = "Fetching title…";
      fetch("/api/title?url=" + encodeURIComponent(url)).then(function (res) {
        return res.ok ? res.json() : { title: "" };
      }).then(function (data) {
        if (id !== requestId || !data.title) return;
        if (titleInput.value.trim() && titleInput.value !== autoTitle) return;
        titleInput.value = autoTitle = data.title;
      }).catch(function (e) {
        console.error(e);
      }).then(function () {
        if (id === requestId) titleInput.placeholder = defaultPlaceholder;
      });
    }

    urlInput.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(lookup, 500);
    });
  }

  function setupLogging() {
    document.getElementById("cancelEditBtn").addEventListener("click", resetForm);

    document.getElementById("logBtn").addEventListener("click", function () {
      var btn = this;
      var payload = {
        clipTitle: document.getElementById("clipTitle").value.trim(),
        clipUrl: document.getElementById("clipUrl").value.trim(),
        reps: Number(document.getElementById("reps").value) || 1,
        confidence: confSelected,
        notes: getNotes()
      };
      var request;
      if (editing) {
        payload.date = document.getElementById("sessionDate").value || editing.date;
        payload.loggedAt = editing.loggedAt;
        request = sendJSON("PUT", API + "/" + editing.id, payload);
      } else {
        payload.date = todayISO();
        payload.loggedAt = new Date().toISOString();
        request = postJSON(API, payload);
      }

      btn.disabled = true;
      request.then(function () {
        resetForm();
        return fetchSessions();
      }).then(renderAll).catch(function (e) {
        console.error(e);
        btn.textContent = "Couldn't save — is the server running? Try again";
      }).then(function () {
        btn.disabled = false;
      });
    });
  }

  function setupTheme() {
    var btn = document.getElementById("themeToggle");
    var stored = null;
    try { stored = localStorage.getItem("shadowing-tracker-theme"); } catch (e) {}
    if (stored) {
      document.documentElement.setAttribute("data-theme", stored);
    }
    updateThemeBtnLabel();

    btn.addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var effectiveDark = current ? current === "dark" : prefersDark;
      var next = effectiveDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("shadowing-tracker-theme", next); } catch (e) {}
      updateThemeBtnLabel();
    });
  }

  function updateThemeBtnLabel() {
    var current = document.documentElement.getAttribute("data-theme");
    var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    var effectiveDark = current ? current === "dark" : prefersDark;
    document.getElementById("themeToggle").textContent = effectiveDark ? "Light" : "Dark";
  }

  document.addEventListener("DOMContentLoaded", function () {
    setupConfidence();
    setupEditor();
    setupLogging();
    setupAutoTitle();
    setupTheme();
    renderAll();

    importLegacySessions().then(fetchSessions).then(function (sessions) {
      renderAll();

      // Pre-fill today's clip if the person is picking up mid-session
      var last = sessions.slice().sort(function (a, b) {
        return (b.date + b.loggedAt) > (a.date + a.loggedAt) ? 1 : -1;
      })[0];
      if (last && last.date === todayISO()) {
        document.getElementById("clipTitle").value = last.clipTitle || "";
        document.getElementById("clipUrl").value = last.clipUrl || "";
      }
    }).catch(function (e) {
      console.error(e);
      document.getElementById("historyList").textContent = "Couldn't reach the server to load sessions.";
    });
  });
})();
</script>
</body>
</html>
